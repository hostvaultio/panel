name: Build

on:
  push:
    branches:
      - 'chore/panel-upstream-*'
  pull_request:
    branches:
      - "1.0-develop"
      - "hostvault/**"

concurrency:
  group: panel-ui-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22 ]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - run: yarn tsc
      - run: yarn lint
      - run: yarn build:production
