name: Hostvault panel contracts

on:
  push:
    branches:
      - 'chore/panel-upstream-*'
  pull_request:
    branches:
      - 'hostvault/**'

permissions:
  contents: read

concurrency:
  group: hostvault-panel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    name: PHP 8.3 / MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: panel-ci-only
          MYSQL_DATABASE: testing
        ports:
          - 3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, gd, mbstring, pdo_mysql, pcntl, posix, xml, zip
          tools: composer:v2
          coverage: none
      - name: Configure isolated test environment
        run: cp .env.ci .env
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Unit tests
        run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests/Unit
        env:
          DB_HOST: UNIT_NO_DB
      - name: Integration and fork contract tests
        run: vendor/bin/phpunit tests/Integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: panel-ci-only
